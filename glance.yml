server:
  assets-path: /app/assets

# theme:
#   background-color: 50 1 6
#   primary-color: 24 97 58
#   negative-color: 355 85 52
#   positive-color: 165 98 35
theme:
  light: true
  background-color: 220 23 95
  contrast-multiplier: 1.0
  primary-color: 220 91 54
  positive-color: 109 58 40
  negative-color: 347 87 44


# =======================
# BRANDING SETTINGS
# =======================

# https://github.com/glanceapp/glance/blob/main/docs/configuration.md#branding
branding:
    hide-footer: true
    logo-text: "PoGo Pi"
    app-name: "Pi"

# =======================
# THEME SETTINGS
# =======================

# # https://github.com/glanceapp/glance/blob/main/docs/configuration.md#the-config-file
# theme:
#   $include: theme.yml


# =======================
# PAGES
# =======================

# https://github.com/glanceapp/glance/blob/main/docs/configuration.md#the-config-file

pages:
  - $include: home.yml
  - $include: media.yml
