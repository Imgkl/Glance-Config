# yaml-language-server: $schema=https://raw.githubusercontent.com/not-first/glance-schema/master/schema.json

  pages:
  - name: Media
    head-widgets:
            - type: custom-api
              title: Now Playing
              cache: 5s
              options:
                media-server: "jellyfin"
                base-url: ${JELLYFIN_URL}
                api-key: ${JELLYFIN_KEY}
                small-column: false
                compact: true
                play-state: "text"
                show-thumbnail: true
                full-thumbnail: true
                show-paused: true
                show-progress-bar: true
                show-progress-info: true
                time-format: "15:04"
              template: |
                {{ $mediaServer := .Options.StringOr "media-server" "plex" }}
                {{ $baseURL := .Options.StringOr "base-url" "" }}
                {{ $apiKey := .Options.StringOr "api-key" "" }}

                {{ define "errorMsg" }}
                  <div class="widget-error-header">
                    <div class="color-negative size-h3">ERROR</div>
                    <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
                    </svg>
                  </div>
                <p class="break-all">{{ . }}</p>
                {{ end }}

                {{ if or
                (eq $mediaServer "")
                (eq $baseURL "")
                (eq $apiKey "")
                }}
                {{ template "errorMsg" "Some required options are not set" }}
                {{ else }}

                {{ $isSmallColumn := .Options.BoolOr "small-column" false }}
                {{ $isCompact := .Options.BoolOr "compact" true }}
                {{ $playState := .Options.StringOr "play-state" "indicator" }}
                {{ $showThumbnail := .Options.BoolOr "show-thumbnail" false }}
                {{ $fullThumbnail := .Options.BoolOr "full-thumbnail" false }}
                {{ $showPaused := .Options.BoolOr "show-paused" false }}
                {{ $showProgressBar := .Options.BoolOr "show-progress-bar" false }}
                {{ $showProgressInfo := .Options.BoolOr "show-progress-info" true }}
                {{ $timeFormat := .Options.StringOr "time-format" "15:04" }}

                {{ $userID := "" }}
                {{ $sessionsRequestURL := "" }}
                {{ $sessionsCall := "" }}
                {{ $sessions := "" }}
                {{ $activeSessions := 0 }}

                {{ if eq $mediaServer "plex" }}
                  {{ $sessionsRequestURL = concat $baseURL "/status/sessions" }}
                  {{ $sessionsCall = newRequest $sessionsRequestURL
                  | withHeader "Accept" "application/json"
                  | withHeader "X-Plex-Token" $apiKey
                  | getResponse }}

                {{ if $sessionsCall.JSON.Exists "MediaContainer" }}
                  {{ $sessions = $sessionsCall.JSON.Array "MediaContainer.Metadata" }}
                  {{ $activeSessions = len $sessions }}
                {{ else }}
                  {{ template "errorMsg" (concat "Could not fetch " $mediaServer " API.") }}
                {{ end }}

                {{ else if eq $mediaServer "tautulli" }}
                {{ $sessionsRequestURL = concat $baseURL "/api/v2" }}
                {{ $sessionsCall = newRequest $sessionsRequestURL
                  | withParameter "apikey" $apiKey
                  | withParameter "cmd" "get_activity"
                  | withHeader "Accept" "application/json"
                  | getResponse }}

                 {{ if eq $sessionsCall.Response.StatusCode 200 }}
                 {{ $sessions = $sessionsCall.JSON.Array "response.data.sessions" }}
                 {{ $activeSessions = len $sessions }}
                 {{ else }}
                 {{ template "errorMsg" (concat "Could not fetch " $mediaServer " API.") }}
                 {{ end }}

                {{ else if or (eq $mediaServer "jellyfin") (eq $mediaServer "emby") }}
                {{ $sessionsRequestURL = concat $baseURL "/Sessions" }}
                {{ $sessionsCall = newRequest $sessionsRequestURL
                | withParameter "api_key" $apiKey
                | withParameter "activeWithinSeconds" "30"
                | withHeader "Accept" "application/json"
                | getResponse }}

                {{ if eq $sessionsCall.Response.StatusCode 200 }}
                  {{ $sessions = $sessionsCall.JSON.Array "" }}
                  {{ if eq $mediaServer "emby" }}
                    {{ range $session := $sessions }}
                      {{ if $session.Bool "PlayState.CanSeek" }}
                        {{ $activeSessions = 1 }}
                        {{ break }}
                      {{ end }}
                    {{ end }}
                  {{ else }}
                    {{ $activeSessions = len $sessions }}
                  {{ end }}
                {{ else }}
                  {{ template "errorMsg" (concat "Could not fetch " $mediaServer " API.") }}
                {{ end }}
                {{ end }}

                {{ if and (eq $sessionsCall.Response.StatusCode 200) (eq $activeSessions 0) }}
                  <p>Nothing is playing right now.</p>
                {{ else }}

                <style>
                .media-server-session-container--grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                }
                @media (max-width: 768px) {
                .media-server-session-container--grid {
                  display: flex;
                  flex-direction: column;
                }
                }
                .media-server-progress-container {
                height: 1rem;
                max-width: 32rem;
                border: 1px solid var(--color-text-base);
                border-radius: var(--border-radius);
                overflow: hidden;
                }
                .media-server-progress-bar {
                height: 100%;
                background: var(--color-primary);
                border-radius: 3px;
                transition: width 1s linear;
                }
                @keyframes progress-animation { to { width: 100%; } }
                </style>

                <div class="gap-10 {{ if $isSmallColumn }}flex flex-column{{ else }}media-server-session-container--grid{{ end }}">
                {{ range $i, $session := $sessions }}
                  {{ $isClient := true }}
                  {{ $isPlaying := false }}
                  {{ $state := "playing" }}
                  {{ $isMovie := false }}
                  {{ $isShows := false }}
                  {{ $isMusic := false }}
                  {{ $userName := "" }}
                  {{ $title := "" }}
                  {{ $showTitle := "" }}
                  {{ $showSeason := "" }}
                  {{ $showEpisode := "" }}
                  {{ $artist := "" }}
                  {{ $albumTitle := "" }}
                  {{ $thumbURL := "" }}
                  {{ $now := now | formatTime "15:04:05" | parseLocalTime "15:04:05" }}
                  {{ $duration := 0 }}
                  {{ $offset := 0 }}
                  {{ $remainingSeconds := 0 }}

                  {{ if eq $mediaServer "plex" }}
                    {{ $isPlaying = eq ($session.String "Player.state") "playing" }}
                    {{ if not $isPlaying }}
                      {{ $state = "paused"}}
                    {{ end }}

                    {{ $mediaType := $session.String "type" }}
                    {{ $isMovie = eq $mediaType "movie" }}
                    {{ $isShows = eq $mediaType "episode" }}
                    {{ $isMusic = eq $mediaType "track" }}

                    {{ $userName = $session.String "User.title" }}
                    {{ $title = $session.String "title" }}
                    {{ $showTitle = $session.String "grandparentTitle" }}
                    {{ $showSeason = $session.String "parentIndex" }}
                    {{ $showEpisode = $session.String "index" }}
                    {{ $artist = $session.String "grandparentTitle" }}
                    {{ $albumTitle = $session.String "parentTitle" }}

                    {{ $thumbID := $session.String "thumb" }}
                    {{ if or $isShows $isMusic }}
                      {{ $thumbID = $session.String "parentThumb" }}
                    {{ end }}
                    {{ $thumbURL = concat $baseURL $thumbID "?X-Plex-Token=" $apiKey }}

                    {{ $duration = $session.Float "duration" }}
                    {{ $offset = $session.Float "viewOffset" }}
                    {{ $remainingSeconds = div (sub $duration $offset) 1000 | toInt }}
                  {{ else if eq $mediaServer "tautulli" }}
                    {{ $isPlaying = eq ($session.String "state") "playing" }}
                    {{ if not $isPlaying }}
                      {{ $state = "paused"}}
                    {{ end }}

                    {{ $mediaType := $session.String "media_type" }}
                    {{ $isMovie = eq $mediaType "movie" }}
                    {{ $isShows = eq $mediaType "episode" }}
                    {{ $isMusic = eq $mediaType "track" }}

                    {{ $userName = $session.String "user" }}
                    {{ $title = $session.String "title" }}
                    {{ $showTitle = $session.String "grandparent_title" }}
                    {{ $showSeason = $session.String "parent_media_index" }}
                    {{ $showEpisode = $session.String "media_index" }}
                    {{ $artist = $session.String "grandparent_title" }}
                    {{ $albumTitle = $session.String "parent_title" }}

                    {{ $thumbID := $session.String "thumb" }}
                    {{ if or $isShows $isMusic }}
                      {{ $thumbID = $session.String "parent_thumb" }}
                    {{ end }}
                    {{ $thumbURL = concat $baseURL "/api/v2?apikey=" $apiKey "&cmd=pms_image_proxy&img=" $thumbID }}

                    {{ $duration = $session.Float "duration" }}
                    {{ $offset = $session.Float "view_offset" }}
                    {{ $remainingSeconds = div (sub $duration $offset) 1000 | toInt }}
                  {{ else if or (eq $mediaServer "jellyfin") (eq $mediaServer "emby") }}
                    {{ if eq $mediaServer "emby" }}
                      {{ $isClient = $session.Bool "PlayState.CanSeek" }}
                    {{ end }}
                    {{ $isPlaying = and ($session.Exists "NowPlayingItem") (not ($session.Bool "PlayState.IsPaused")) }}
                    {{ if not $isPlaying }}
                      {{ $state = "paused"}}
                    {{ end }}

                    {{ $mediaType := $session.String "NowPlayingItem.Type" }}
                    {{ $isMovie = eq $mediaType "Movie" }}
                    {{ $isShows = eq $mediaType "Episode" }}
                    {{ $isMusic = eq $mediaType "Audio" }}

                    {{ $userName = $session.String "UserName" }}
                    {{ $title = $session.String "NowPlayingItem.Name" }}
                    {{ $showTitle = $session.String "NowPlayingItem.SeriesName" }}
                    {{ $showSeason = $session.String "NowPlayingItem.ParentIndexNumber" }}
                    {{ $showEpisode = $session.String "NowPlayingItem.IndexNumber" }}
                    {{ $artist = $session.String "NowPlayingItem.AlbumArtist" }}
                    {{ $albumTitle = $session.String "NowPlayingItem.Album" }}

                    {{ $thumbID := $session.String "NowPlayingItem.Id" }}
                    {{ if $isShows }}
                      {{ $thumbID = $session.String "NowPlayingItem.ParentId" }}
                    {{ end }}
                    {{ $thumbURL = concat $baseURL "/Items/" $thumbID "/Images/Primary?api_key=" $apiKey }}

                    {{ $duration = $session.Float "NowPlayingItem.RunTimeTicks" }}
                    {{ $offset = $session.Float "PlayState.PositionTicks" }}
                    {{ $remainingSeconds = div (sub $duration $offset) 10000000 | toInt }}
                  {{ end }}

                  {{ $progress := mul 100 (div $offset $duration) | toInt }}
                  {{ $endTime := $now.Add (duration (printf "%ds" $remainingSeconds)) | formatTime $timeFormat }}

                  {{ $showInfoFormat := concat "Season " $showSeason " Episode " $showEpisode}}
                  {{ if $isCompact }}
                    {{ $showInfoFormat = concat "S" $showSeason "E" $showEpisode}}
                  {{ end }}

                  {{ if and $isClient (or $isPlaying $showPaused) }}
                  <div class="card gap-5">
                    <div class="flex items-center gap-10 size-h3">
                    <span class="color-primary">{{ $userName }}</span>
                  {{ if eq $playState "text" }}
                    <span {{ if $isPlaying }}class="color-primary"{{ end }}>
                  [{{ $state }}]
                   </span>
                  {{ else if eq $playState "indicator" }}
                  <style>
                .media-server-indicator {
                  height: .7rem;
                  width: .7rem;
                  border-radius: 100%;
                  {{ if $isPlaying }}
                    animation: pulse 5s infinite;
                    background: var(--color-primary);
                  {{ else }}
                    background: var(--color-text-base-muted);
                  {{ end }}
                }
                @keyframes pulse {
                  0% { box-shadow: 0 0 0 0 var(--color-text-base); }
                  40% { box-shadow: 0 0 0 4px transparent; }
                  100% { box-shadow: 0 0 0 4px transparent; }
                }
                </style>
                <div class="media-server-indicator"></div>
                {{ end }}
                </div>

                 <hr class="margin-bottom-5" />

                <div class="flex items-center gap-10" style="align-items: stretch;">
                {{ if $showThumbnail }}
                 <img src="{{ $thumbURL | safeURL }}"
                alt="{{ $title }} thumbnail"
                class="shrink-0"
                loading="lazy"
                style="
                  max-width: 7.5rem;
                  border: 2px solid var(--color-primary);
                  border-radius: var(--border-radius);
                  object-fit: cover;
                  {{ if and $isCompact (not $fullThumbnail) }} aspect-ratio: 1; {{ end }} "
                />
                {{ end }}
                <ul class="flex flex-column grow justify-evenly" style="width: 0;">
                 {{ if $isCompact }}
                 {{ if $isShows }}
                  <ul class="list-horizontal-text flex-nowrap">
                    <li class="shrink-0">{{ concat "S" $showSeason "E" $showEpisode }}</li>
                    <li class="text-truncate">{{ $showTitle }}</li>
                  </ul>
                {{ else if $isMusic }}
                  <ul class="list-horizontal-text flex-nowrap">
                    <li class="shrink-0">{{ $artist }}</li>
                    <li class="text-truncate">{{ $albumTitle }}</li>
                  </ul>
                {{ end }}
                <li class="text-truncate">{{ $title }}</li>
                {{ else }}
                {{ if $isShows }}
                  <li>{{ $showTitle }}</li>
                  <li>{{ concat "S" $showSeason "E" $showEpisode }}</li>
                {{ else if $isMusic }}
                  <li>{{ $artist }}</li>
                  <li>{{ $albumTitle }}</li>
                {{ end }}
                <li>{{ $title }}</li>
                {{ end }}

                <li>
                {{ if and $isPlaying $showProgressBar }}
                  <div class="flex gap-10 items-center">
                    <div class="media-server-progress-container grow">
                      <div
                        class ="media-server-progress-bar"
                        data-progress="{{ $progress }}"
                        data-remaining="{{ $remainingSeconds }}"
                        style="
                          width: {{ $progress }}%;
                          animation: progress-animation {{ $remainingSeconds }}s linear forwards;"
                      >
                      </div>
                    </div>
                    {{ if $showProgressInfo }}
                      <p>
                        {{ if and (not $isCompact) (not $isSmallColumn) }}
                          ends at 
                        {{ end }}
                        {{ $endTime }}
                      </p>
                    {{ end }}
                  </div>
                {{ end }}
                </li>
                </ul>
                </div>
                </div>
                {{ end }}
                {{ end }}
                </div>
                {{ end }}
                {{ end }}



    columns:
      # -----------------------
      # FULL COLUMN
      # -----------------------
      - size: full
        width: wide
        widgets:
            - type: group
              widgets:
                - type: custom-api
                  title: Latest Movies
                #   frameless: true
                  cache: 1m
                  options:
                    base-url: ${JELLYFIN_URL}
                    api-key: ${JELLYFIN_KEY}
                    user-name: "Imgkl"
                    library-name: "Movies"
                    mode: "latest"
                    item-count: "30"
                    small-column: false
                    show-thumbnail: true
                    thumbnail-aspect-ratio: "default"
                  template: |
                    {{/* Required config options */}}
                    {{ $baseURL := .Options.StringOr "base-url" "" }}
                    {{ $apiKey := .Options.StringOr "api-key" "" }}
                    {{ $userName := .Options.StringOr "user-name" "" }}

                    {{/* Required config options for "latest" mode */}}
                    {{ $libraryName := .Options.StringOr "library-name" "" }}

                    {{/* Optional config options */}}
                    {{ $mode := .Options.StringOr "mode" "latest" }}
                    {{ $itemCount := .Options.StringOr "item-count" "10" }}
                    {{ $mediaTypes := .Options.StringOr "media-types" "Movie,Episode,MusicAlbum" }}
                    {{ $thumbAspectRatio := .Options.StringOr "thumbnail-aspect-ratio" "" }}
                    {{ $isSmallColumn:= .Options.BoolOr "small-column" false }}
                    {{ $showThumbnail := .Options.BoolOr "show-thumbnail" false }}
                    {{ $showProgressBar := .Options.BoolOr "progress-bar" true }}

                    {{/* Error message template */}}
                    {{ define "errorMsg" }}
                      <div class="widget-error-header">
                        <div class="color-negative size-h3">ERROR</div>
                        <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
                        </svg>
                      </div>
                      <p class="break-all">{{ . }}</p>
                    {{ end }}

                    {{/* Check required fields */}}
                    {{ if or (eq $baseURL "") (eq $apiKey "") (eq $userName "") (eq $mode "") (and (eq $mode "latest") (eq $libraryName "")) }}
                      {{ template "errorMsg" "Some required options are not set." }}
                    {{ else }}

                    {{/* Fetch user ID */}}
                    {{ $userID := "" }}
                    {{ $usersCall := newRequest (print $baseURL "/Users")
                      | withParameter "api_key" $apiKey
                      | withHeader "Accept" "application/json"
                      | getResponse }}

                    {{ range $i, $user := $usersCall.JSON.Array "" }}
                      {{ if eq ($user.String "Name") $userName }}
                        {{ $userID = $user.String "Id" }}
                        {{ break }}
                      {{ end }}
                    {{ end }}
                    {{ if eq $userID "" }}
                      {{ template "errorMsg" (printf "User '%s' not found." $userName) }}
                    {{ else }}

                      {{ $items := "" }}

                      {{ if eq $mode "latest" }}

                        {{/* Fetch library ID */}}
                        {{ $libraryID := "" }}
                        {{ $userViewsCall := newRequest (print $baseURL "/UserViews")
                          | withParameter "api_key" $apiKey
                          | withParameter "userId" $userID
                          | withHeader "Accept" "application/json"
                          | getResponse }}

                        {{ range $i, $item := $userViewsCall.JSON.Array "Items" }}
                          {{ if eq ($item.String "Name") $libraryName }}
                            {{ $libraryID = $item.String "Id" }}
                            {{ break }}
                          {{ end }}
                        {{ end }}

                        {{ if eq $libraryID "" }}
                          {{ template "errorMsg" (printf "Library '%s' not found." $libraryName) }}
                        {{ else }}
                          {{/* Fetch latest items */}}
                          {{ $latestCall := newRequest (print $baseURL "/Users/" $userID "/Items/Latest")
                            | withParameter "api_key" $apiKey
                            | withParameter "Limit" $itemCount
                            | withParameter "ParentId" $libraryID
                            | withParameter "IncludeItemTypes" $mediaTypes
                            | withParameter "GroupItems" "true"
                            | withHeader "Accept" "application/json"
                            | getResponse }}
                          {{ $items = $latestCall.JSON.Array "" }}
                        {{ end }}

                      {{ else if eq $mode "nextup" }}

                        {{/* Fetch next up items */}}
                        {{ $nextUpCall := newRequest (print $baseURL "/Shows/NextUp")
                          | withParameter "api_key" $apiKey
                          | withParameter "UserId" $userID
                          | withParameter "Limit" $itemCount
                          | withParameter "EnableResumable" "true"
                          | withHeader "Accept" "application/json"
                          | getResponse }}
                       {{ $items = $nextUpCall.JSON.Array "Items" }}

                     {{ else }}
                       {{ template "errorMsg" "Unknown mode, expected 'latest' or 'nextup'" }}
                     {{ end }}

                     {{ if eq (len $items) 0 }}
                    <p>No items found, start streaming something!</p>
                    {{ else }}

                    {{/* Display the item carousel */}}
                    <div class="carousel-container show-right-cutoff">
                      <div class="cards-horizontal carousel-items-container">
                    {{ range $n, $item := $items }}
                      {{/* Common item variables */}}
                      {{ $mediaType := $item.String "Type" }}
                      {{ $title := $item.String "Name" }}
                      {{ $itemID := $item.String "Id" }}

                      {{/* Media type specific variables */}}
                      {{ $seriesTitle := "" }}
                      {{ $artist := "" }}
                      {{ $seriesID := "" }}
                      {{ $season := "" }}
                      {{ $episode := "" }}
                      {{ $playPercentage := "" }}
                      {{ $unwatchedEpisodeCount := "" }}

                      {{ if eq $mediaType "Movie" }}
                      {{ else if eq $mediaType "Series" }}
                        {{ $unwatchedEpisodeCount = $item.Int "UserData.UnplayedItemCount" }}
                      {{ else if eq $mediaType "Episode" }}
                        {{ $unwatchedEpisodeCount = 1 }}
                        {{ $seriesTitle = $item.String "SeriesName" }}
                        {{ $seriesID = $item.String "SeriesId" }}
                        {{ $season = $item.Int "ParentIndexNumber" }}
                        {{ $episode = $item.Int "IndexNumber" }}

                        {{ if $item.Exists "UserData.PlayedPercentage" }}
                          {{ $playPercentage = $item.String "UserData.PlayedPercentage" }}
                        {{ end }}

                        {{/* For latest always refer to the series not individual episodes */}}
                        {{ if eq $mode "latest" }}
                          {{ $itemID = $seriesID }}
                          {{ $title = $seriesTitle }}
                        {{ end }}
                      {{ else if eq $mediaType "MusicAlbum" }}
                        {{ $artist = $item.String "AlbumArtist" }}
                      {{ end }}

                      {{ $linkURL := print $baseURL "/web/#/details?id=" $itemID }}
                      {{ $thumbURL := "" }}
                      {{ if not (eq $playPercentage "") }}
                        {{/* $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey "&percentPlayed=" $playPercentage */}}
                        {{ $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey }}
                      {{ else }}
                        {{ $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey }}
                      {{ end }}

                      <a class="card widget-content-frame" href="{{ $linkURL | safeURL }}">
                      {{ if $showThumbnail }}
                        <div style="position: relative;">
                          <img src="{{ $thumbURL | safeURL }}"
                          alt="{{ $title }} thumbnail"
                          loading="lazy"
                          class="media-server-thumbnail shrink-0"
                          style="
                            object-fit: fill;
                            border-radius: var(--border-radius) var(--border-radius) 0 0;
                            width: 100%;
                            display: block;
                          {{ if eq $thumbAspectRatio "square" }}aspect-ratio: 1;
                          {{ else if eq $thumbAspectRatio "portrait" }}aspect-ratio: 2/3;
                          {{ else if eq $thumbAspectRatio "landscape" }}aspect-ratio: 16/9;
                          {{ else }}aspect-ratio: initial;
                          {{ end }}
                        "
                      />

                      {{ if and ($showProgressBar) (not (eq $playPercentage "")) }}
                        <div style="
                          position: absolute;
                          bottom: 8px;
                          left: 8px;
                          right: 8px;
                          height: 6px;
                          border-radius: var(--border-radius);
                          overflow: hidden;
                          background-color: rgba(255, 255, 255, 0.2);
                        ">
                          <div style="
                            width: {{ print $playPercentage "%" }};
                            height: 100%;
                            border-radius: var(--border-radius) 0 0 var(--border-radius);
                            background-color: var(--color-primary)
                          "></div>
                        </div>
                      {{ end }}
                    </div>
                    {{ end }}

                    <div class="grow padding-inline-widget margin-top-10 margin-bottom-10">
                    <ul class="flex flex-column justify-evenly margin-bottom-3 {{ if $isSmallColumn }}size-h6{{ end }}" style="height: 100%;">
                      {{ if eq $mode "latest" }}
                        {{ if or (eq $mediaType "Series") (eq $mediaType "Episode") }}
                          <ul class="list-horizontal-text flex-nowrap">
                            <li class="color-primary shrink-0">{{ $unwatchedEpisodeCount }}</li>
                            <li class="text-truncate">{{ $title }}</li>
                          </ul>
                        {{ else if eq $mediaType "MusicAlbum" }}
                          <ul class="list-horizontal-text flex-nowrap">
                            <li class="color-primary text-truncate">{{ $artist }}</li>
                            <li class="text-truncate">{{ $title }}</li>
                          </ul>
                        {{ else }}
                          <li class="text-truncate">{{ $title }}</li>
                        {{ end }}
                      {{ else if eq $mode "nextup" }}
                        <ul class="list-horizontal-text flex-nowrap">
                          <li class="color-primary shrink-0">S{{ $season }}E{{ $episode }}</li>
                          <li class="text-truncate">{{ $seriesTitle }}</li>
                        </ul>
                        <li class="text-truncate">{{ $title }}</li>
                      {{ end }}
                    </ul>
                    </div>
                    </a>
                    {{ end }}
                    </div>
                    </div>
                    {{ end }}
                    {{ end }}
                    {{ end }}

                - type: custom-api
                  title: Latest Shows
                #   frameless: true
                  cache: 1m
                  options:
                    base-url: ${JELLYFIN_URL}
                    api-key: ${JELLYFIN_KEY}
                    user-name: "Imgkl"
                    library-name: "Shows"
                    mode: "latest"
                    item-count: "30"
                    small-column: false
                    show-thumbnail: true
                    thumbnail-aspect-ratio: "default"
                  template: |
                    {{/* Required config options */}}
                    {{ $baseURL := .Options.StringOr "base-url" "" }}
                    {{ $apiKey := .Options.StringOr "api-key" "" }}
                    {{ $userName := .Options.StringOr "user-name" "" }}

                    {{/* Required config options for "latest" mode */}}
                    {{ $libraryName := .Options.StringOr "library-name" "" }}

                    {{/* Optional config options */}}
                    {{ $mode := .Options.StringOr "mode" "latest" }}
                    {{ $itemCount := .Options.StringOr "item-count" "10" }}
                    {{ $mediaTypes := .Options.StringOr "media-types" "Movie,Episode,MusicAlbum" }}
                    {{ $thumbAspectRatio := .Options.StringOr "thumbnail-aspect-ratio" "" }}
                    {{ $isSmallColumn:= .Options.BoolOr "small-column" false }}
                    {{ $showThumbnail := .Options.BoolOr "show-thumbnail" false }}
                    {{ $showProgressBar := .Options.BoolOr "progress-bar" true }}

                    {{/* Error message template */}}
                    {{ define "errorMsg" }}
                      <div class="widget-error-header">
                        <div class="color-negative size-h3">ERROR</div>
                        <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
                        </svg>
                      </div>
                      <p class="break-all">{{ . }}</p>
                    {{ end }}

                    {{/* Check required fields */}}
                    {{ if or (eq $baseURL "") (eq $apiKey "") (eq $userName "") (eq $mode "") (and (eq $mode "latest") (eq $libraryName "")) }}
                      {{ template "errorMsg" "Some required options are not set." }}
                    {{ else }}

                    {{/* Fetch user ID */}}
                    {{ $userID := "" }}
                    {{ $usersCall := newRequest (print $baseURL "/Users")
                      | withParameter "api_key" $apiKey
                      | withHeader "Accept" "application/json"
                      | getResponse }}

                    {{ range $i, $user := $usersCall.JSON.Array "" }}
                      {{ if eq ($user.String "Name") $userName }}
                        {{ $userID = $user.String "Id" }}
                        {{ break }}
                      {{ end }}
                    {{ end }}
                    {{ if eq $userID "" }}
                      {{ template "errorMsg" (printf "User '%s' not found." $userName) }}
                    {{ else }}

                      {{ $items := "" }}

                      {{ if eq $mode "latest" }}

                        {{/* Fetch library ID */}}
                        {{ $libraryID := "" }}
                        {{ $userViewsCall := newRequest (print $baseURL "/UserViews")
                          | withParameter "api_key" $apiKey
                          | withParameter "userId" $userID
                          | withHeader "Accept" "application/json"
                          | getResponse }}

                        {{ range $i, $item := $userViewsCall.JSON.Array "Items" }}
                          {{ if eq ($item.String "Name") $libraryName }}
                            {{ $libraryID = $item.String "Id" }}
                            {{ break }}
                          {{ end }}
                        {{ end }}

                        {{ if eq $libraryID "" }}
                          {{ template "errorMsg" (printf "Library '%s' not found." $libraryName) }}
                        {{ else }}
                          {{/* Fetch latest items */}}
                          {{ $latestCall := newRequest (print $baseURL "/Users/" $userID "/Items/Latest")
                            | withParameter "api_key" $apiKey
                            | withParameter "Limit" $itemCount
                            | withParameter "ParentId" $libraryID
                            | withParameter "IncludeItemTypes" $mediaTypes
                            | withParameter "GroupItems" "true"
                            | withHeader "Accept" "application/json"
                            | getResponse }}
                          {{ $items = $latestCall.JSON.Array "" }}
                        {{ end }}

                      {{ else if eq $mode "nextup" }}

                        {{/* Fetch next up items */}}
                        {{ $nextUpCall := newRequest (print $baseURL "/Shows/NextUp")
                          | withParameter "api_key" $apiKey
                          | withParameter "UserId" $userID
                          | withParameter "Limit" $itemCount
                          | withParameter "EnableResumable" "true"
                          | withHeader "Accept" "application/json"
                          | getResponse }}
                       {{ $items = $nextUpCall.JSON.Array "Items" }}

                     {{ else }}
                       {{ template "errorMsg" "Unknown mode, expected 'latest' or 'nextup'" }}
                     {{ end }}

                     {{ if eq (len $items) 0 }}
                    <p>No items found, start streaming something!</p>
                    {{ else }}

                    {{/* Display the item carousel */}}
                    <div class="carousel-container show-right-cutoff">
                      <div class="cards-horizontal carousel-items-container">
                    {{ range $n, $item := $items }}
                      {{/* Common item variables */}}
                      {{ $mediaType := $item.String "Type" }}
                      {{ $title := $item.String "Name" }}
                      {{ $itemID := $item.String "Id" }}

                      {{/* Media type specific variables */}}
                      {{ $seriesTitle := "" }}
                      {{ $artist := "" }}
                      {{ $seriesID := "" }}
                      {{ $season := "" }}
                      {{ $episode := "" }}
                      {{ $playPercentage := "" }}
                      {{ $unwatchedEpisodeCount := "" }}

                      {{ if eq $mediaType "Movie" }}
                      {{ else if eq $mediaType "Series" }}
                        {{ $unwatchedEpisodeCount = $item.Int "UserData.UnplayedItemCount" }}
                      {{ else if eq $mediaType "Episode" }}
                        {{ $unwatchedEpisodeCount = 1 }}
                        {{ $seriesTitle = $item.String "SeriesName" }}
                        {{ $seriesID = $item.String "SeriesId" }}
                        {{ $season = $item.Int "ParentIndexNumber" }}
                        {{ $episode = $item.Int "IndexNumber" }}

                        {{ if $item.Exists "UserData.PlayedPercentage" }}
                          {{ $playPercentage = $item.String "UserData.PlayedPercentage" }}
                        {{ end }}

                        {{/* For latest always refer to the series not individual episodes */}}
                        {{ if eq $mode "latest" }}
                          {{ $itemID = $seriesID }}
                          {{ $title = $seriesTitle }}
                        {{ end }}
                      {{ else if eq $mediaType "MusicAlbum" }}
                        {{ $artist = $item.String "AlbumArtist" }}
                      {{ end }}

                      {{ $linkURL := print $baseURL "/web/#/details?id=" $itemID }}
                      {{ $thumbURL := "" }}
                      {{ if not (eq $playPercentage "") }}
                        {{/* $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey "&percentPlayed=" $playPercentage */}}
                        {{ $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey }}
                      {{ else }}
                        {{ $thumbURL = concat $baseURL "/Items/" $itemID "/Images/Primary?api_key=" $apiKey }}
                      {{ end }}

                      <a class="card widget-content-frame" href="{{ $linkURL | safeURL }}">
                      {{ if $showThumbnail }}
                        <div style="position: relative;">
                          <img src="{{ $thumbURL | safeURL }}"
                          alt="{{ $title }} thumbnail"
                          loading="lazy"
                          class="media-server-thumbnail shrink-0"
                          style="
                            object-fit: fill;
                            border-radius: var(--border-radius) var(--border-radius) 0 0;
                            width: 100%;
                            display: block;
                          {{ if eq $thumbAspectRatio "square" }}aspect-ratio: 1;
                          {{ else if eq $thumbAspectRatio "portrait" }}aspect-ratio: 2/3;
                          {{ else if eq $thumbAspectRatio "landscape" }}aspect-ratio: 16/9;
                          {{ else }}aspect-ratio: initial;
                          {{ end }}
                        "
                      />

                      {{ if and ($showProgressBar) (not (eq $playPercentage "")) }}
                        <div style="
                          position: absolute;
                          bottom: 8px;
                          left: 8px;
                          right: 8px;
                          height: 6px;
                          border-radius: var(--border-radius);
                          overflow: hidden;
                          background-color: rgba(255, 255, 255, 0.2);
                        ">
                          <div style="
                            width: {{ print $playPercentage "%" }};
                            height: 100%;
                            border-radius: var(--border-radius) 0 0 var(--border-radius);
                            background-color: var(--color-primary)
                          "></div>
                        </div>
                      {{ end }}
                    </div>
                    {{ end }}

                    <div class="grow padding-inline-widget margin-top-10 margin-bottom-10">
                    <ul class="flex flex-column justify-evenly margin-bottom-3 {{ if $isSmallColumn }}size-h6{{ end }}" style="height: 100%;">
                      {{ if eq $mode "latest" }}
                        {{ if or (eq $mediaType "Series") (eq $mediaType "Episode") }}
                          <ul class="list-horizontal-text flex-nowrap">
                            <li class="color-primary shrink-0">{{ $unwatchedEpisodeCount }}</li>
                            <li class="text-truncate">{{ $title }}</li>
                          </ul>
                        {{ else if eq $mediaType "MusicAlbum" }}
                          <ul class="list-horizontal-text flex-nowrap">
                            <li class="color-primary text-truncate">{{ $artist }}</li>
                            <li class="text-truncate">{{ $title }}</li>
                          </ul>
                        {{ else }}
                          <li class="text-truncate">{{ $title }}</li>
                        {{ end }}
                      {{ else if eq $mode "nextup" }}
                        <ul class="list-horizontal-text flex-nowrap">
                          <li class="color-primary shrink-0">S{{ $season }}E{{ $episode }}</li>
                          <li class="text-truncate">{{ $seriesTitle }}</li>
                        </ul>
                        <li class="text-truncate">{{ $title }}</li>
                      {{ end }}
                    </ul>
                    </div>
                    </a>
                    {{ end }}
                    </div>
                    </div>
                    {{ end }}
                    {{ end }}
                    {{ end }}

                - type: custom-api
                  title: History
                #   frameless: true
                  cache: 1m
                  options:
                    media-server: "jellyfin"
                    base-url: ${JELLYFIN_URL}
                    api-key: ${JELLYFIN_KEY}
                    user-name: "Imgkl"
                    history-length: "15"
                    small-column: false
                    compact: true
                    show-thumbnail: true
                    thumbnail-aspect-ratio: "default"
                    show-user: false
                    time-absolute: false
                    time-format: ""
                  template: |
                    {{ $mediaServer := .Options.StringOr "media-server" "" }}
                    {{ $baseURL := .Options.StringOr "base-url" "" }}
                    {{ $apiKey := .Options.StringOr "api-key" "" }}
                    {{ $userName := .Options.StringOr "user-name" "" }}

                    {{ define "errorMsg" }}
                    <div class="widget-error-header">
                      <div class="color-negative size-h3">ERROR</div>
                      <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
                      </svg>
                    </div>
                    <p class="break-all">{{ . }}</p>
                    {{ end }}

                    {{ if or
                    (eq $mediaServer "")
                    (eq $baseURL "")
                    (eq $apiKey "")
                    (and (eq $mediaServer "jellyfin") (eq $userName ""))
                    }}
                    {{ template "errorMsg" "Some required options are not set" }}
                    {{ else }}

                    {{ $historyLength := .Options.StringOr "history-length" "10" }}
                    {{ $mediaTypes := .Options.StringOr "media-types" "" }}
                    {{ if eq $mediaServer "tautulli" }}
                      {{ $mediaTypes = .Options.StringOr "media-types" "movie,episode,track" }}
                    {{ else if or (eq $mediaServer "jellyfin") (eq $mediaServer "emby") }}
                      {{ $mediaTypes = .Options.StringOr "media-types" "Movie,Episode,Audio" }}
                    {{ end }}
                    {{ $isSmallColumn := .Options.BoolOr "small-column" false }}
                    {{ $isCompact := .Options.BoolOr "compact" true }}
                    {{ $showThumbnail := .Options.BoolOr "show-thumbnail" false }}
                    {{ $thumbAspectRatio := .Options.StringOr "thumbnail-aspect-ratio" "" }}
                    {{ $showUser := .Options.BoolOr "show-user" true }}
                    {{ $timeAbsolute := .Options.BoolOr "time-absolute" false }}
                    {{ $timeFormat := .Options.StringOr "time-format" "Jan 02 15:04" }}

                    {{ $userID := "" }}
                    {{ $historyRequestURL := "" }}
                    {{ $usersRequestURL := "" }}
                    {{ $historyCall := "" }}
                    {{ $usersCall := "" }}
                    {{ $history := "" }}
                    {{ $users := "" }}

                    {{ if eq $mediaServer "plex" }}
                      {{ $historyRequestURL = concat $baseURL "/status/sessions/history/all" }}
                      {{ $historyCall = newRequest $historyRequestURL
                        | withParameter "limit" $historyLength
                        | withParameter "sort" "viewedAt:desc"
                        | withHeader "Accept" "application/json"
                        | withHeader "X-Plex-Token" $apiKey
                        | getResponse }}

                       {{ if $historyCall.JSON.Exists "MediaContainer" }}
                         {{ $history = $historyCall.JSON.Array "MediaContainer.Metadata" }}
                       {{ else }}
                         {{ template "errorMsg" (concat "Could not fetch " $mediaServer " API.") }}
                       {{ end }}

                       {{ $usersRequestURL = concat $baseURL "/accounts" }}
                       {{ $usersCall = newRequest $usersRequestURL
                        | withHeader "Accept" "application/json"
                        | withHeader "X-Plex-Token" $apiKey
                        | getResponse }}
                      {{ $users = $usersCall.JSON.Array "MediaContainer.Account" }}

                      {{ else if eq $mediaServer "tautulli" }}
                      {{ $historyRequestURL = concat $baseURL "/api/v2" }}
                      {{ $historyCall = newRequest $historyRequestURL
                      | withParameter "apikey" $apiKey
                      | withParameter "cmd" "get_history"
                      | withParameter "length" $historyLength
                      | withParameter "media_type" $mediaTypes
                      | withHeader "Accept" "application/json"
                      | getResponse }}

                     {{ if eq $historyCall.Response.StatusCode 200 }}
                       {{ $history = $historyCall.JSON.Array "response.data.data" }}
                     {{ else }}
                       {{ template "errorMsg" (concat "Could not fetch " $mediaServer " API.") }}
                     {{ end }}

                     {{ else if or (eq $mediaServer "jellyfin") (eq $mediaServer "emby") }}
                     {{ $usersRequestURL = concat $baseURL "/Users" }}
                     {{ $usersCall = newRequest $usersRequestURL
                     | withParameter "api_key" $apiKey
                     | withHeader "Accept" "application/json"
                     | getResponse }}

                    {{ $usersList := $usersCall.JSON.Array "" }}
                      {{ range $i, $user := $usersList }}
                        {{ if eq ($user.String "Name") $userName }}
                          {{ $userID = $user.String "Id" }}
                          {{ break }}
                        {{ end }}
                    {{ end }}
                    {{ if eq $userID "" }}
                        {{ template "errorMsg" (concat "User '" $userName "' not found.") }}
                    {{ end }}

                    {{ $historyRequestURL = concat $baseURL "/Users/" $userID "/Items" }}
                    {{ $historyCall = newRequest $historyRequestURL
                        | withParameter "api_key" $apiKey
                        | withParameter "Limit" $historyLength
                        | withParameter "IncludeItemTypes" $mediaTypes
                        | withParameter "Recursive" "true"
                        | withParameter "isPlayed" "true"
                        | withParameter "sortBy" "DatePlayed"
                        | withParameter "sortOrder" "Descending"
                        | withParameter "Fields" "UserDataLastPlayedDate"
                        | withHeader "Accept" "application/json"
                        | getResponse }}

                      {{ $history = $historyCall.JSON.Array "Items" }}
                      {{ end }}

                    {{ if and (eq $historyCall.Response.StatusCode 200) (eq (len $history) 0) }}
                      <p>Nothing has been played. Start streaming something!</p>
                    {{ else }}
                     <div class="carousel-container show-right-cutoff">
                      <div class="cards-horizontal carousel-items-container">
                      {{ range $n, $item := $history }}
                      {{ $mediaType := "" }}
                      {{ $isMovie := false }}
                      {{ $isShows := false }}
                      {{ $isMusic := false }}
                      {{ $title := "" }}
                      {{ $showTitle := "" }}
                      {{ $showSeason := "" }}
                      {{ $showEpisode := "" }}
                      {{ $artist := "" }}
                      {{ $albumTitle := "" }}
                      {{ $thumbURL := "" }}
                      {{ $playedAt := "" }}

                      {{ if eq $mediaServer "plex" }}
                        {{ $userID = $item.Int "accountID" }}
                          {{ range $n, $u := $users }}
                            {{ if eq $userID ($u.Int "id") }}
                            {{ $userName = $u.String "name" }}
                            {{ break }}
                          {{ end }}
                        {{ end }}

                        {{ $mediaType = $item.String "type" }}
                        {{ $isMovie = eq $mediaType "movie" }}
                        {{ $isShows = eq $mediaType "episode" }}
                        {{ $isMusic = eq $mediaType "track" }}

                        {{ $title = $item.String "title" }}
                        {{ if $isShows }}
                          {{ $showTitle = $item.String "grandparentTitle" }}
                          {{ $showSeason = $item.String "parentIndex" }}
                          {{ $showEpisode = $item.String "index" }}
                        {{ else if $isMusic }}
                          {{ $artist = $item.String "grandparentTitle" }}
                          {{ $albumTitle = $item.String "parentTitle" }}
                        {{ end }}

                        {{ $thumbID := $item.String "thumb" }}
                        {{ if or $isShows $isMusic}}
                          {{ $thumbID = $item.String "parentThumb" }}
                        {{ end }}
                        {{ $thumbURL = concat $baseURL $thumbID "?X-Plex-Token=" $apiKey }}

                        {{ $time := $item.String "viewedAt" }}
                        {{ if $timeAbsolute }}
                          {{ $playedAt = $time | parseLocalTime "unix" | formatTime $timeFormat }}
                        {{ else }}
                          {{ $playedAt = $time | parseRelativeTime "unix" }}
                        {{ end }}

                        {{ else if eq $mediaServer "tautulli" }}
                        {{ $userName = $item.String "user" }}
                        {{ $mediaType = $item.String "media_type" }}
                        {{ $isMovie = eq $mediaType "movie" }}
                        {{ $isShows = eq $mediaType "episode" }}
                        {{ $isMusic = eq $mediaType "track" }}

                        {{ $title = $item.String "title" }}
                        {{ if $isShows }}
                          {{ $showTitle = $item.String "grandparent_title" }}
                          {{ $showSeason = $item.String "parent_media_index" }}
                          {{ $showEpisode = $item.String "media_index" }}
                        {{ else if $isMusic }}
                          {{ $artist = $item.String "grandparent_title" }}
                          {{ $albumTitle = $item.String "parent_title" }}
                        {{ end }}

                        {{ $thumbID := $item.String "thumb" }}
                        {{ $thumbURL = concat $baseURL "/api/v2?apikey=" $apiKey "&cmd=pms_image_proxy&img=" $thumbID }}

                        {{ $time := $item.String "date" }}
                        {{ if $timeAbsolute }}
                          {{ $playedAt = $time | parseLocalTime "unix" | formatTime $timeFormat }}
                        {{ else }}
                          {{ $playedAt = $time | parseRelativeTime "unix" }}
                        {{ end }}

                      {{ else if or (eq $mediaServer "jellyfin") (eq $mediaServer "emby") }}
                        {{ $mediaType = $item.String "Type" }}
                        {{ $isMovie = eq $mediaType "Movie" }}
                        {{ $isShows = eq $mediaType "Episode" }}
                        {{ $isMusic = eq $mediaType "Audio" }}

                        {{ $title = $item.String "Name" }}
                        {{ if $isShows }}
                          {{ $showTitle = $item.String "SeriesName" }}
                          {{ $showSeason = $item.String "ParentIndexNumber" }}
                          {{ $showEpisode = $item.String "IndexNumber" }}
                        {{ else if $isMusic }}
                          {{ $artist = $item.String "AlbumArtist" }}
                          {{ $albumTitle = $item.String "Album" }}
                        {{ end }}

                        {{ $thumbID := $item.String "Id" }}
                        {{ if $isShows }}
                          {{ $thumbID  = $item.String "SeasonId" }}
                        {{ end }}
                        {{ $thumbURL = concat $baseURL "/Items/" $thumbID "/Images/Primary?api_key=" $apiKey }}

                        {{ $time := $item.String "UserData.LastPlayedDate" }}
                        {{ if $timeAbsolute }}
                          {{ $playedAt = $time | parseLocalTime "rfc3339" | formatTime $timeFormat }}
                        {{ else }}
                          {{ $playedAt = $time | parseRelativeTime "rfc3339" }}
                        {{ end }}
                      {{ end }}

                      {{ $showInfoFormat := concat "Season " $showSeason " Episode " $showEpisode}}
                      {{ if $isCompact }}
                        {{ $showInfoFormat = concat "S" $showSeason "E" $showEpisode}}
                      {{ end }}

                      <div class="card widget-content-frame">
                      {{ if $showThumbnail }}
                        <img src="{{ $thumbURL | safeURL }}"
                        alt="{{ $title }} thumbnail"
                        loading="lazy"
                        class="media-server-thumbnail shrink-0"
                        style="
                        object-fit: cover;
                    border-radius: var(--border-radius) var(--border-radius) 0 0;
                    {{ if eq $thumbAspectRatio "square" }}
                      aspect-ratio: 1;
                    {{ else if eq $thumbAspectRatio "portrait" }}
                      aspect-ratio: 3/4;
                    {{ else if eq $thumbAspectRatio "landscape" }}
                      aspect-ratio: 4/3;
                    {{ else }}
                      aspect-ratio: initial;
                    {{ end }}
                    "
                    />
                    {{ end }}

                     <div class="grow padding-inline-widget margin-top-10 margin-bottom-10">
                      <ul class="flex flex-column justify-evenly margin-bottom-3 {{if $isSmallColumn}}size-h6{{end}}" style="height: 100%;">
                      {{ if $isCompact }}
                    <ul class="list-horizontal-text flex-nowrap">
                      {{ if $showUser }}
                        <li class="color-primary text-truncate">{{ $userName }}</li>
                      {{ end }}

                      {{ if $timeAbsolute }}
                        <li class="text-truncate">{{ $playedAt }}</li>
                      {{ else }}
                        <li class="shrink-0">
                          <span {{ $playedAt }}></span>
                          {{ if not $showUser }}
                            <span> ago</span>
                          {{ end }}
                        </li>
                      {{ end }}
                    </ul>

                    {{ if $isShows }}
                      <ul class="list-horizontal-text flex-nowrap">
                        <li class="text-truncate">{{ $showInfoFormat }}</li>
                        <li class="text-truncate">{{ $showTitle }}</li>
                      </ul>
                    {{ else if $isMusic }}
                      <ul class="list-horizontal-text flex-nowrap">
                        <li class="text-truncate">{{ $artist }}</li>
                        <li class="text-truncate">{{ $albumTitle }}</li>
                      </ul>
                    {{ end }}

                    <li class="text-truncate">{{ $title }}</li>
                    {{ else }}
                    {{ if $showUser }}
                      <li class="color-primary text-truncate">{{ $userName }}</li>
                    {{ end }}

                    {{ if $timeAbsolute }}
                      <li class="text-truncate">{{ $playedAt }}</li>
                    {{ else }}
                      <li class="text-truncate">
                        <span {{ $playedAt }}></span>
                        <span> ago</span>
                      </li>
                    {{ end }}

                    {{ if $isShows }}
                      <li class="text-truncate">{{ $showTitle }}</li>
                      <li class="text-truncate">{{ $showInfoFormat }}</li>
                    {{ else if $isMusic }}
                      <li class="text-truncate">{{ $artist }}</li>
                      <li class="text-truncate">{{ $albumTitle }}</li>
                    {{ end }}
                    <li class="text-truncate">{{ $title }}</li>
                    {{ end }}
                    </ul>
                    </div>
                    </div>
                    {{ end }}
                    </div>
                    </div>
                    {{ end }}
                    {{ end }}
            
            - type: custom-api
              title: qBittorrent
              title-url: ${QBITTORRENT_URL}
              cache: 1s
              options:
                view: "detailed"   # "basic" or "detailed"
                mode: "upload"    # "default" or "upload"
              subrequests:
                transfer:
                  url: http://${QBITTORRENT_IP}/api/v2/transfer/info
                seeding:
                  url: http://${QBITTORRENT_IP}/api/v2/torrents/info
                  parameters:
                    filter: seeding
                leeching:
                  url: http://${QBITTORRENT_IP}/api/v2/torrents/info
                  parameters:
                    filter: downloading
              template: |
                {{ $transfer := .Subrequest "transfer" }}
                {{ $seeding := .Subrequest "seeding" }}
                {{ $leeching := .Subrequest "leeching" }}
            
                {{ if and (eq $transfer.Response.StatusCode 200) (eq $seeding.Response.StatusCode 200) (eq $leeching.Response.StatusCode 200) }}
            
                  {{ $isDetailed := eq (.Options.StringOr "view" "detailed") "detailed" }}
                  {{ $mode := .Options.StringOr "mode" "default" }}
            
                  {{ if $isDetailed }}
                  <!-- Detailed View -->
                  <div class="list" style="--list-gap: 15px;">
                    <div class="flex justify-between text-center">
                      <div>
                        {{ $dlSpeed := $transfer.JSON.Float "dl_info_speed" }}
                        {{ if eq $mode "upload" }}
                          <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}</div>
                        {{ else }}
                          {{ if lt $dlSpeed 1048576.0 }}
                            <div class="color-highlight size-h3">{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}</div>
                          {{ else }}
                            <div class="color-highlight size-h3">{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}</div>
                          {{ end }}
                        {{ end }}
                        <div class="size-h6">DOWNLOADING</div>
                      </div>
            
                      {{ if eq $mode "upload" }}
                      <div>
                        {{ $ulSpeed := $transfer.JSON.Float "up_info_speed" }}
                        <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}</div>
                        <div class="size-h6">UPLOADING</div>
                      </div>
                      {{ end }}
            
                      <div>
                        <div class="color-highlight size-h3">{{ len ($seeding.JSON.Array "") }}</div>
                        <div class="size-h6">SEEDING</div>
                      </div>
            
                      {{ if eq $mode "default" }}
                      <div>
                        <div class="color-highlight size-h3">{{ len ($leeching.JSON.Array "") }}</div>
                        <div class="size-h6">LEECHING</div>
                      </div>
                      {{ end }}
                    </div>
            
                    <!-- Downloading list -->
                    {{ $downloadingTorrents := $leeching.JSON.Array "" }}
                    {{ if gt (len $downloadingTorrents) 0 }}
                      <div style="margin-top: 15px;">
                        <ul class="list collapsible-container" data-collapse-after="0" style="--list-gap: 15px;">
                          {{ range $t := $downloadingTorrents }}
                            {{ $state := $t.String "state" }}
                            {{ $icon := "?" }}
                            {{ if ge ($t.Int "completed") ($t.Int "size") }}{{ $icon = "✔" }}
                            {{ else if eq $state "downloading" "forcedDL" }}{{ $icon = "↓" }}
                            {{ else if eq $state "pausedDL" "stoppedDL" "pausedUP" "stalledDL" "stalledUP" "queuedDL" "queuedUP" }}{{ $icon = "❚❚" }}
                            {{ else if eq $state "error" "missingFiles" }}{{ $icon = "!" }}
                            {{ else if eq $state "checkingDL" "checkingUP" "allocating" }}{{ $icon = "…" }}
                            {{ else if eq $state "checkingResumeData" }}{{ $icon = "⟳" }}
                            {{ end }}
            
                            <li class="flex items-center" style="gap: 10px;">
                              <div class="size-h4" style="flex-shrink: 0;">{{ $icon }}</div>
                              <div style="flex-grow: 1; min-width: 0;">
                                <div class="text-truncate color-highlight">{{ $t.String "name" }}</div>
                                <div title="{{ $t.Float "progress" | mul 100 | printf "%.1f" }}%" style="background: rgba(128, 128, 128, 0.2); border-radius: 5px; height: 6px; margin-top: 5px; overflow: hidden;">
                                  <div style="width: {{ $t.Float "progress" | mul 100 }}%; background-color: var(--color-positive); height: 100%; border-radius: 5px;"></div>
                                </div>
                              </div>
                              <div style="flex-shrink: 0; text-align: right; width: 80px;">
                                {{ $dlSpeed := $t.Float "dlspeed" }}
                                <div class="size-sm color-paragraph">
                                  {{ if eq $mode "upload" }}
                                    {{ if lt $dlSpeed 1000.0 }}--{{ else }}{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}{{ end }}
                                  {{ else }}
                                    {{ if lt $dlSpeed 1024.0 }}--{{ else if lt $dlSpeed 1048576.0 }}{{ printf "%.0f KiB/s" (div $dlSpeed 1024.0) }}{{ else }}{{ printf "%.1f MiB/s" (div $dlSpeed 1048576.0) }}{{ end }}
                                  {{ end }}
                                </div>
                                {{ $eta := $t.Int "eta" }}
                                <div class="size-sm color-paragraph">
                                  {{ if eq $eta 8640000 }}∞
                                  {{ else if gt $eta 3600 }}{{ printf "%dh %dm" (div $eta 3600) (mod (div $eta 60) 60) }}
                                  {{ else if gt $eta 0 }}{{ printf "%dm" (div $eta 60) }}
                                  {{ else }}--{{ end }}
                                </div>
                              </div>
                            </li>
                          {{ end }}
                        </ul>
                      </div>
                    {{ end }}
            
                    <!-- Seeding list -->
                    {{ if eq $mode "upload" }}
                      {{ $seedingTorrents := $seeding.JSON.Array "" }}
                      {{ if gt (len $seedingTorrents) 0 }}
                        <div style="margin-top: 20px;">
                          <ul class="list collapsible-container" data-collapse-after="0" style="--list-gap: 15px;">
                            {{ range $t := $seedingTorrents }}
                              {{ $state := $t.String "state" }}
                              {{ $icon := "↑" }}
                              {{ if eq $state "pausedUP" "stoppedUP" "stalledUP" "queuedUP" }}{{ $icon = "❚❚" }}
                              {{ else if eq $state "error" "missingFiles" }}{{ $icon = "!" }}
                              {{ else if eq $state "checkingUP" }}{{ $icon = "…" }}
                              {{ else if eq $state "checkingResumeData" }}{{ $icon = "⟳" }}
                              {{ end }}
            
                              <li class="flex items-center" style="gap: 10px;">
                                <div class="size-h4" style="flex-shrink: 0;">{{ $icon }}</div>
                                <div style="flex-grow: 1; min-width: 0;">
                                  <div class="text-truncate color-highlight">{{ $t.String "name" }}</div>
                                  <div class="size-sm color-paragraph">
                                    Ratio: {{ printf "%.2f" ($t.Float "ratio") }} | 
                                    Size: {{ printf "%.1f GB" (div ($t.Float "size") 1073741824.0) }}
                                  </div>
                                </div>
                                <div style="flex-shrink: 0; text-align: right; width: 80px;">
                                  {{ $ulSpeed := $t.Float "upspeed" }}
                                  <div class="size-sm color-paragraph">
                                    {{ if lt $ulSpeed 1000.0 }}--{{ else }}{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}{{ end }}
                                  </div>
                                  <div class="size-sm color-paragraph">Upload</div>
                                </div>
                              </li>
                            {{ end }}
                          </ul>
                        </div>
                      {{ end }}
                    {{ end }}
            
                  </div>
            
                  {{ else }}
                  <!-- Basic View -->
                  <div class="flex justify-between text-center">
                    <div>
                      {{ $dlSpeed := $transfer.JSON.Float "dl_info_speed" }}
                      <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}</div>
                      <div class="size-h6">DOWNLOADING</div>
                    </div>
                    {{ if eq $mode "upload" }}
                    <div>
                      {{ $ulSpeed := $transfer.JSON.Float "up_info_speed" }}
                      <div class="color-highlight size-h3">{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}</div>
                      <div class="size-h6">UPLOADING</div>
                    </div>
                    {{ end }}
                    <div>
                      <div class="color-highlight size-h3">{{ len ($seeding.JSON.Array "") }}</div>
                      <div class="size-h6">SEEDING</div>
                    </div>
                    {{ if eq $mode "default" }}
                    <div>
                      <div class="color-highlight size-h3">{{ len ($leeching.JSON.Array "") }}</div>
                      <div class="size-h6">LEECHING</div>
                    </div>
                    {{ end }}
                  </div>
                  {{ end }}
            
                {{ else }}
                  <div class="color-negative text-center">
                    <p>Error fetching qBittorrent data.</p>
                    <p class="size-sm">Check URL and authentication bypass settings.</p>
                  </div>
                {{ end }}

            - type: iframe
              source: ${TG_SAVED_MESSAGE}
              title: Telegram
              height: 685

      # -----------------------
      # SMALL COLUMN
      # -----------------------
      - size: small
        widgets:
          - type: bookmarks
            title: Quick Links
            groups:
            - title: ARRs
              links:
              - title: Radarr
                url: ${RADARR_URL}
              - title: Sonarr
                url: ${SONARR_URL}
              - title: Bazarr
                url: ${BAZARR_URL}
              - title: Prowlarr
                url: ${PROWLARR_URL}
              - title: Jellyseerr
                url: ${JELLYSEERR_URL}
            - title: Media Server
              links:
              - title: Jellyfin
                url: ${JELLYFIN_URL}
            - title: Downloaders
              links:
              - title: qBittorrent
                url: ${QBITTORRENT_URL}
              - title: Telegram Files
                url: ${TELEGRAM_FILES_URL}
            - title: Files
              links:
              - title: File Manager
                url: ${FILES_URL}

          - type: custom-api
            title: "Jellyfin Stats"
            cache: 1m
            base-url: ${JELLYFIN_URL}
            options:
              url: ${JELLYFIN_URL}
              key: ${JELLYFIN_KEY}
            template: |
              {{ $url := .Options.StringOr "url" "" }}
              {{ $key := .Options.StringOr "key" "" }}
              {{- if or (eq $url "") (eq $key "") -}}
              <p>Error: The URL or API Key was not configured in the widget options.</p>
              {{- else -}}
              {{- $requestUrl := printf "%s/emby/Items/Counts?api_key=%s" $url $key -}}
              {{- $jellyfinData := newRequest $requestUrl | getResponse -}}
              {{- if eq $jellyfinData.Response.StatusCode 200 -}}
                <div class="flex flex-column gap-5">
                  <div class="flex justify-between text-center">
                  <div>
                    <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "MovieCount" | formatNumber }}</div>
                    <div class="size-h5 uppercase">Movies</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "SeriesCount" | formatNumber }}</div>
                    <div class="size-h5 uppercase">TV Shows</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "EpisodeCount" | formatNumber }}</div>
                      <div class="size-h5 uppercase">Episodes</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h3">{{ $jellyfinData.JSON.Int "SongCount" | formatNumber }}</div>
                      <div class="size-h5 uppercase">Songs</div>
                    </div>
                 </div>
                </div>
                {{- else -}}
              <p>Failed: {{ $jellyfinData.Response.Status }}</p>
              {{- end -}}
              {{- end -}}  

          - type: group
            widgets:
            - type: custom-api
              title: Radarr
              title-url: ${RADARR_URL}
              cache: 5m
              options:
                service: radarr          # sonarr, radarr, or lidarr
                type: recent           # upcoming, recent, or missing
                size: small             # small, medium, large, or huge
                collapse-after: 3
                show-grabbed: true
                interval: 15             # optional, days
              #   sort-time: asc          # optional, asc or desc (default)
                #cover-proxy: "https://proxy.example.com/radarrcover" # optional
                api-base-url: ${RADARR_API_URL}
                key: ${RADARR_KEY}
                url: ${RADARR_URL}       # optional
              template: |
                {{ $collapseAfter := .Options.IntOr "collapse-after" 5 }}
                {{ $showGrabbed := .Options.BoolOr "show-grabbed" false }}
                {{ $sortTime := .Options.StringOr "sort-time" "desc" }}
                {{ $coverProxy := .Options.StringOr "cover-proxy" "" }}
                {{ $size := .Options.StringOr "size" "medium" }}
                {{ $service := .Options.StringOr "service" "" }}
                {{ $type := .Options.StringOr "type" "" }}
                {{ $intervalH := .Options.IntOr "interval" 0 | mul 24 }}
                {{ $now := now | formatTime "2006-01-02T15:04:05" }}
                {{ $posInterval := (offsetNow (printf "+%dh" $intervalH)) | formatTime "2006-01-02T15:04:05" }}
                {{ $negInterval := (offsetNow (printf "-%dh" $intervalH)) | formatTime "2006-01-02T15:04:05" }}
                {{ $apiBaseUrl := .Options.StringOr "api-base-url" "" }}
                {{ $key := .Options.StringOr "key" "" }}
                {{ $url := .Options.StringOr "url" $apiBaseUrl }}
                {{ if or (and (ne $service "sonarr") (ne $service "radarr") (ne $service "lidarr"))
                (and (ne $type "upcoming") (ne $type "recent") (ne $type "missing")) 
                (eq $apiBaseUrl "") (eq $key "") (eq $url "") }}
                <div class="widget-error-header">
                <div class="color-negative size-h3">ERROR</div>
                <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
                </svg>
                </div>
                <p class="break-all">
                Some options are not set or malformed
                 <table style="border-spacing: 1rem;">
                  <tr><td>service</td><td>{{ $service }}</td><td>must be sonarr, radarr, or lidarr</td></tr>
                  <tr><td>type</td><td>{{ $type }}</td><td>must be upcoming, recent, or missing</td></tr>
                  <tr><td>api-base-url</td><td>{{ $apiBaseUrl }}</td><td>should include http(s):// and port if needed</td></tr>
                  <tr><td>key</td><td>{{ $key }}</td><td></td></tr>
                </table> 
                </p>
                {{ else }}
                  {{ $requestUrl := "" }}
  
                  {{ if eq $service "sonarr" }}
                    {{ if eq $type "recent" }}
                      {{ $requestUrl = printf "%s/api/v3/history/since?includeSeries=true&includeEpisode=true&eventType=grabbed&date=%s" $apiBaseUrl $negInterval }}
                    {{ else if eq $type "missing" }}
                      {{ $requestUrl = printf "%s/api/v3/wanted/missing?page=1&pageSize=50&includeSeries=true" $apiBaseUrl }}
                    {{ else if eq $type "upcoming" }}
                      {{ $requestUrl = printf "%s/api/v3/calendar?includeSeries=true&start=%s&end=%s" $apiBaseUrl $now $posInterval }}
                    {{ end }}
        
                  {{ else if eq $service "radarr" }}
                    {{ if eq $type "recent" }}
                      {{ $requestUrl = printf "%s/api/v3/history/since?includeMovie=true&eventType=grabbed&date=%s" $apiBaseUrl $negInterval }}
                    {{ else if eq $type "missing" }}
                      {{ $requestUrl = printf "%s/api/v3/wanted/missing?page=1&pageSize=50" $apiBaseUrl }}
                    {{ else if eq $type "upcoming" }}
                      {{ $requestUrl = printf "%s/api/v3/calendar?start=%s&end=%s" $apiBaseUrl $now $posInterval }}
                    {{ end }}
        
                  {{ else if eq $service "lidarr" }}
                    {{ if eq $type "recent" }}
                      {{ $requestUrl = printf "%s/api/v1/history/since?includeArtist=true&includeAlbum=true&eventType=grabbed&date=%s" $apiBaseUrl $negInterval }}
                    {{ else if eq $type "missing" }}
                      {{ $requestUrl = printf "%s/api/v1/wanted/missing?page=1&pageSize=50&includeArtist=true" $apiBaseUrl }}
                    {{ else if eq $type "upcoming" }}
                      {{ $requestUrl = printf "%s/api/v1/calendar?includeArtist=true&start=%s&end=%s" $apiBaseUrl $now $posInterval }}
                    {{ end }}
                  {{ end }}
  
                 {{ $data := newRequest $requestUrl
                  | withHeader "Accept" "application/json"
                  | withHeader "X-Api-Key" $key
                  | getResponse }}
  
                <ul class="list list-gap-14 collapsible-container single-line-titles" data-collapse-after="{{ $collapseAfter }}">
                {{ $array := "" }}
                {{ $sortByField := "" }}
                {{ $itemDisplayed := false }}
                {{ $itemDate := "" }}
                {{ $isAvailable := false }}
  
                {{ if eq $type "missing" }}
                  {{ $array = "records" }}
                  {{ if eq $service "sonarr" }}
                    {{ $sortByField = "airDateUtc" }}
                  {{ else }}
                    {{ $sortByField = "releaseDate" }}
                  {{ end }}
                {{ else if eq $type "recent" }}
                  {{ $sortByField = "date" }}
                {{ else }}
                  {{ if eq $service "sonarr" }}
                    {{ $sortByField = "airDateUtc" }}
                  {{ else }}
                    {{ $sortByField = "releaseDate" }}
                  {{ end }}
                {{ end }}
  
                {{ range $data.JSON.Array $array | sortByTime $sortByField "rfc3339" $sortTime }}
            
                  {{ if eq $service "sonarr" }}
                    {{ $itemDate = .String "airDateUtc" | parseTime "RFC3339" }}
                    {{ $itemDate = $itemDate.In now.Location | formatTime "2006-01-02T15:04:05" }}
                    {{ $isAvailable = true }}
                  {{ else if eq $service "radarr"}}
                    {{ $isAvailable = .Bool "isAvailable" }}
                    {{ $itemDate = .String "releaseDate" }}
                  {{ else if eq $service "lidarr"}}
                    {{ $itemDate = .String "releaseDate" }}
                    {{ $isAvailable = true }}
                  {{ end }}
  
                  {{ if or (eq $type "upcoming") (eq $type "recent") (and (or (and (gt $itemDate $negInterval) ((lt $itemDate $now ))) (eq $intervalH 0))  $isAvailable) }}
                    {{ $itemDisplayed = true }}
                    {{ $title := "" }}
                    {{ $subtitle := "" }}
                    {{ $coverUrl := "" }}
                    {{ $status := "" }}
                    {{ $coverBase := "" }}
                    {{ $height := "" }}
                    {{ $width := "" }}
                    {{ $popoverTitle := "" }}
                    {{ $popoverSubtitle := "" }}
                    {{ $popoverSummary := "" }}
                    {{ $summary := "" }}
                    {{ $link := "" }}
                    {{ $grabbed := false }}
                    {{ $date := now }}
                    {{ $datetype := "" }}
                    {{ $seString := "" }}
                    {{ $genres := "" }}
                    {{ $buttonJustify := "left" }}
  
    
                    {{ if eq $service "sonarr" }}
                      {{ $series := "" }}
                      {{ if eq $coverProxy "" }}
                        {{ $coverBase = printf "%s/api/v3/mediacover" $apiBaseUrl }}
                        {{ $coverUrl = printf "%s/%s/poster-500.jpg?apikey=%s" $coverBase (.String "seriesId") $key }}
                      {{ else }}
                        {{ $coverBase = $coverProxy }}
                        {{ $coverUrl = printf "%s/%s/poster-500.jpg" $coverBase (.String "seriesId") }}
                      {{ end }}
                      {{ $title = .String "series.title" }}
                      {{ $link = printf "%s/series/%s#" $url (.String "series.titleSlug") }}
                      {{ $series = .Get "series" }}
                      {{ $genres = $series.Get "genres" }}
              
                      {{ if eq $type "recent" }}
                        {{ $date = .String "date" | parseLocalTime "RFC3339" }}
                        {{ $date = $date.In now.Location }}
                        {{ $subtitle = .String "episode.title" }}
                        {{ $summary = .String "episode.overview" }}
                        {{ $seString = printf "S%02dE%02d" (.Int "episode.seasonNumber") (.Int "episode.episodeNumber") }}
                        {{ $datetype = "Downloaded" }}
        
                        {{ if $showGrabbed }}
                          {{ $popoverTitle = .String "episode.title" }}
                          {{ $popoverSubtitle = $seString }}
                          {{ $popoverSummary = .String "episode.overview" }}
                          {{ if .Bool "episode.hasFile" }}
                            {{ $grabbed = true }}
                          {{ end }}
                        {{ else }}
                          {{ $popoverTitle = .String "series.title" }}
                          {{ $popoverSummary = .String "series.overview" }}
                        {{ end }}
    
                      {{ else if eq $type "missing" }}
                        {{ $date = .String "airDateUtc" | parseLocalTime "RFC3339" }}
                        {{ $date = $date.In now.Location }}
                        {{ $subtitle = .String "title" }}
                        {{ $summary = .String "overview" }}
                        {{ $seString = printf "S%02dE%02d" (.Int "seasonNumber") (.Int "episodeNumber") }}
                        {{ $datetype = "Aired" }}
                        {{ if $showGrabbed }}
                          {{ $popoverTitle = .String "title" }}
                          {{ $popoverSubtitle = $seString }}
                          {{ $popoverSummary = .String "overview" }}
                          {{ if .Bool "episode.hasFile" }}
                            {{ $grabbed = true }}
                          {{ end }}
                        {{ else }}
                          {{ $popoverTitle = .String "series.title" }}
                          {{ $popoverSummary = .String "series.overview" }}
                        {{ end }}
                      {{ else if eq $type "upcoming" }}
                        {{ $date = .String "airDateUtc" | parseLocalTime "RFC3339" }}
                        {{ $date = $date.In now.Location }}
                        {{ $subtitle = .String "title" }}
                        {{ $summary = .String "overview" }}
                        {{ $seString = printf "S%02dE%02d" (.Int "seasonNumber") (.Int "episodeNumber") }}
                        {{ $datetype = "Airs" }}
                        {{ if $showGrabbed }}
                          {{ $popoverTitle = .String "title" }}
                          {{ $popoverSubtitle = $seString }}
                          {{ $popoverSummary = .String "overview" }}
                          {{ if .Bool "hasFile" }}
                            {{ $grabbed = true }}
                          {{ end }}
                        {{ else }}
                          {{ $popoverTitle = .String "series.title" }}
                          {{ $popoverSummary = .String "series.overview" }}
                        {{ end }}
                      {{ end }}
        
        
                    {{ else if eq $service "radarr" }}
                      {{ $movie := "" }}
                      {{ $status = .String "status" }}
                      {{ if eq $coverProxy "" }}
                        {{ $coverBase = printf "%s/api/v3/mediacover" $apiBaseUrl }}
                      {{ else }}
                        {{ $coverBase = $coverProxy }}
                      {{ end }}
                      {{ if eq $status "announced"}}
                        {{ if ne (.String "inCinemas") "" }}
                          {{ $date = (.String "inCinemas" | parseTime "RFC3339") }}
                          {{ $datetype = "In Cinemas" }}
                        {{ else }}
                          {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                          {{ $datetype = "Releases" }}
                        {{ end }}
                      {{ else if eq $status "inCinemas"}}
                        {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                        {{ $datetype = "Releases" }}
                      {{ else if eq $status "released"}}
                        {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                        {{ $datetype = "Released" }}
                      {{ end }}
    
                      {{ if eq $type "recent" }}
                        {{ if eq $coverProxy "" }}
                          {{ $coverUrl = printf "%s/%s/poster-500.jpg?apikey=%s" $coverBase (.String "movie.id") $key }}
                        {{ else }}
                          {{ $coverUrl = printf "%s/%s/poster-500.jpg" $coverBase (.String "movie.id") }}
                        {{ end }}
                        {{ $datetype = "Downloaded" }}
                        {{ $date = (.String "date" | parseTime "RFC3339") }}
                        {{ $title = .String "movie.title" }}
                        {{ $subtitle = "" }}
                        {{ $summary = .String "movie.overview" }}
                        {{ $popoverTitle = .String "movie.title" }}
                        {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                        {{ $popoverSummary = .String "movie.overview" }}
                        {{ $link = printf "%s/movie/%s#" $url (.String "movie.titleSlug") }}
                        {{ $movie = .Get "movie" }}
                        {{ $genres = $movie.Get "genres" }}
                        {{ if and $showGrabbed (gt (.Int "movie.movieFileId") 0) }}
                          {{ $grabbed = true }}
                        {{ end }}
                      {{ else }}
                        {{ if eq $coverProxy "" }}
                          {{ $coverUrl = printf "%s/%s/poster-500.jpg?apikey=%s" $coverBase (.String "id") $key }}
                        {{ else }}
                          {{ $coverUrl = printf "%s/%s/poster-500.jpg" $coverBase (.String "id") }}
                        {{ end }}
                        {{ $title = .String "title" }}
                        {{ $subtitle = "" }}
                        {{ $summary = .String "overview" }}
                        {{ $link = printf "%s/movie/%s#" $url (.String "titleSlug") }}
                        {{ $popoverTitle = .String "title" }}
                        {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                        {{ $popoverSummary = .String "overview" }}
                        {{ $genres = .Get "genres" }}
                        {{ if eq $type "missing" }}
                          {{ if and $showGrabbed (.Bool "movie.hasFile") }}
                            {{ $grabbed = true }}
                          {{ end }}
                        {{ else }}
                          {{ if and $showGrabbed (.Bool "hasFile") }}
                            {{ $grabbed = true }}
                          {{ end }}
                        {{ end }}
                      {{ end }}
  
        
                    {{ else if eq $service "lidarr" }}
                      {{ $artist := "" }}
                      {{ $album := "" }}
                      {{ $albumId := "" }}
                      {{ if eq $coverProxy "" }}
                        {{ $coverBase = printf "%s/api/v1/mediacover" $apiBaseUrl }}
                      {{ else }}
                        {{ $coverBase = $coverProxy }}
                      {{ end }}
    
                      {{ if eq $type "recent" }}
                        {{ $album = .Get "album" }}
                        {{ $artist = $album.Get "artist" }}
                        {{ if eq $coverProxy "" }}
                          {{ $coverUrl = printf "%s/album/%s/cover-500.jpg?apikey=%s" $coverBase (.String "albumId") $key }}
                        {{ else }}
                          {{ $coverUrl = printf "%s/album/%s/cover-500.jpg" $coverBase (.String "albumId") }}
                        {{ end }}
                        {{ $grabbed = true }}
                        {{ $title = $album.String "title" }}
                        {{ $date = (.String "date" | parseTime "RFC3339") }}
                        {{ $datetype = "Downloaded" }}
                        {{ $subtitle = $artist.String "artistName" }}
                        {{ $genres = $artist.Get "genres" }}
                        {{ $link = printf "%s/artist/%s#" $url ($artist.String "foreignArtistId") }}
                        {{ $summary = $album.String "overview" }}
                        {{ $popoverTitle = $album.String "title" }}
                        {{ $popoverSubtitle = printf "%s %s" $datetype ($date | formatTime "1/2/2006") }}
                        {{ $popoverSummary = $artist.String "overview" }}
  
                      {{ else }}
                        {{ $artist = .Get "artist" }}
                        {{ $album = .Get "album" }}
                        {{ if eq $type "missing" }}
                          {{ $datetype = "Released" }}
                        {{ else }}
                          {{ $datetype = "Releases" }}
                        {{ end }}
                        {{ range .Array "releases" }}
                          {{ $albumId = .String "albumId" }}
                          {{ break }}
                        {{ end }}
                        {{ if eq $coverProxy "" }}
                          {{ $coverUrl = printf "%s/album/%s/cover-500.jpg?apikey=%s" $coverBase $albumId $key }}
                        {{ else }}
                          {{ $coverUrl = printf "%s/album/%s/cover-500.jpg" $coverBase $albumId }}
                        {{ end }}
                        {{ $date = (.String "releaseDate" | parseTime "RFC3339") }}
                        {{ $title = .String "title" }}
